name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Checkout the repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup pnpm package manager first (before setup-node cache)
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9
          run_install: false

      # Setup Node.js with pnpm caching (pnpm now available)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # Install JavaScript dependencies with frozen lockfile
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Install Python test dependencies
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest psycopg

      # Run Python Layer 1 aviation tests
      - name: Run Python data tests
        run: python -m pytest tests/data/layer_01_aviation -q

      # Build contracts package
      - name: Build contracts
        run: pnpm --filter @god-eyes/contracts build

      # Build API
      - name: Build API
        run: pnpm --filter api build

      # Build web frontend
      - name: Build web
        run: pnpm --filter web build

      # Run API tests
      - name: Run API tests
        run: pnpm run api:test

      # Check for trailing whitespace and other formatting issues
      - name: Check whitespace
        run: git diff --check
