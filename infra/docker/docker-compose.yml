services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: god-eyes-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-god_eyes_dev}
      POSTGRES_USER: ${POSTGRES_USER:-god_eyes}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-god_eyes_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - god_eyes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: god-eyes-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-god_eyes_minio_dev}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-replace_with_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - god_eyes_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-create-bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-god_eyes_minio_dev}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-replace_with_dev_secret}
      MINIO_BUCKET: ${MINIO_BUCKET:-god-eyes-raw}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ACCESS_KEY:-god_eyes_minio_dev} $${MINIO_SECRET_KEY:-replace_with_dev_secret};
      mc mb --ignore-existing local/$${MINIO_BUCKET:-god-eyes-raw};
      mc anonymous set none local/$${MINIO_BUCKET:-god-eyes-raw};
      "

volumes:
  god_eyes_postgres_data:
  god_eyes_minio_data:
